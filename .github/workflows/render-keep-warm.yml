name: Keep Render API Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production API health endpoint
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://acadlyx-api.onrender.com/api/v1/health
