name: ACADLYX ERP verification

on:
  push:
    branches: ["production-upgrade-2026-09-20", "stabilization-platform-2026-10-09", "chairman-director-enterprise-workspaces-2026-10-11"]
  pull_request:
    branches: ["production-upgrade-2026-09-20"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadlyx
          POSTGRES_PASSWORD: acadlyx
          POSTGRES_DB: acadlyx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acadlyx -d acadlyx_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://acadlyx:acadlyx@localhost:5432/acadlyx_ci?schema=public
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Smoke-test Chairman and Director routes
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/acadlyx-next.log 2>&1 &
          echo $! > /tmp/acadlyx-next.pid
          node scripts/smoke-chairman-director-routes.mjs
