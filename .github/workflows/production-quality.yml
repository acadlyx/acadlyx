name: ACADLYX Production Quality

on:
  push:
    branches:
      - production-upgrade-2026-09-20
      - stabilization-platform-2026-10-09
  pull_request:
    branches:
      - production-upgrade-2026-09-20
      - stabilization-platform-2026-10-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://acadlyx:acadlyx@localhost:5432/acadlyx_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Backend production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  prisma-migrations:
    name: Prisma migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadlyx
          POSTGRES_PASSWORD: acadlyx
          POSTGRES_DB: acadlyx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U acadlyx -d acadlyx_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://acadlyx:acadlyx@localhost:5432/acadlyx_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply all migrations
        run: npx prisma migrate deploy

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  production-smoke:
    name: Production deployment smoke checks
    needs:
      - backend
      - frontend
      - prisma-migrations
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production-upgrade-2026-09-20'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify live deployments
        env:
          ACADLYX_API_URL: https://acadlyx-api.onrender.com
          ACADLYX_WEB_URL: https://acadlyx-orcin.vercel.app
        run: node scripts/production-smoke.mjs
