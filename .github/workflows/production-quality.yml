name: ACADLYX Production Quality

on:
  push:
    branches:
      - production-upgrade-2026-09-20
      - stabilization-platform-2026-10-09
  pull_request:
    branches:
      - production-upgrade-2026-09-20
      - stabilization-platform-2026-10-09
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadlyx
          POSTGRES_PASSWORD: acadlyx
          POSTGRES_DB: acadlyx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U acadlyx -d acadlyx_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://acadlyx:acadlyx@localhost:5432/acadlyx_ci?schema=public
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations for backend tests
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Backend production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  prisma-migrations:
    name: Prisma migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadlyx
          POSTGRES_PASSWORD: acadlyx
          POSTGRES_DB: acadlyx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U acadlyx -d acadlyx_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://acadlyx:acadlyx@localhost:5432/acadlyx_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply all migrations
        run: npx prisma migrate deploy

  legacy-migration-compat:
    name: Populated legacy refund migration compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadlyx
          POSTGRES_PASSWORD: acadlyx
          POSTGRES_DB: acadlyx_legacy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U acadlyx -d acadlyx_legacy_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://acadlyx:acadlyx@localhost:5432/acadlyx_legacy_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply pre-compatibility migrations
        run: |
          mv prisma/migrations/20261010100000_finance_legacy_column_compat /tmp/finance_legacy_column_compat
          npx prisma migrate deploy
      - name: Seed a populated legacy refund row
        run: npx tsx scripts/migrations/legacy-refund-compat.ts seed
      - name: Apply compatibility migration and verify backfill
        run: |
          mv /tmp/finance_legacy_column_compat prisma/migrations/20261010100000_finance_legacy_column_compat
          npx prisma migrate deploy
          npx tsx scripts/migrations/legacy-refund-compat.ts verify

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  finance-performance:
    name: 10k-student finance database performance profile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadlyx
          POSTGRES_PASSWORD: acadlyx
          POSTGRES_DB: acadlyx_perf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U acadlyx -d acadlyx_perf_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://acadlyx:acadlyx@localhost:5432/acadlyx_perf_ci?schema=public
      ACADLYX_PERF_CONFIRM_DISPOSABLE: "YES"
      ACADLYX_PERF_STUDENTS: "10000"
      ACADLYX_PERF_CONCURRENCY: "20"
      ACADLYX_PERF_ITERATIONS_PER_WORKER: "50"
      ACADLYX_PERF_OUTPUT: performance-results.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run 10k-student database workload
        run: npm run perf:finance
      - name: Preserve measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-performance-results
          path: backend/performance-results.json
          if-no-files-found: warn
          retention-days: 30

  browser-smoke:
    name: Desktop and mobile public/login browser smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acadlyx
          POSTGRES_PASSWORD: acadlyx
          POSTGRES_DB: acadlyx_browser_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U acadlyx -d acadlyx_browser_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://acadlyx:acadlyx@localhost:5432/acadlyx_browser_ci?schema=public
      CORS_ORIGIN: http://127.0.0.1:3000
      PORT: "5001"
      NODE_ENV: test
      RBAC_SYNC_ON_BOOT: "false"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Backend Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Prepare backend database and build
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run build
      - name: Start isolated API
        working-directory: backend
        run: |
          nohup npm start > /tmp/acadlyx-api-browser-smoke.log 2>&1 &
          echo $! > /tmp/acadlyx-api-browser-smoke.pid
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:5001/api/v1/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/acadlyx-api-browser-smoke.log
          exit 1
      - name: Frontend Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend for isolated API
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5001
        run: npm run build
      - name: Install Playwright test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run start -- --hostname 127.0.0.1 > /tmp/acadlyx-web-browser-smoke.log 2>&1 &
          echo $! > /tmp/acadlyx-web-browser-smoke.pid
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/acadlyx-web-browser-smoke.log
          exit 1
      - name: Run desktop and mobile browser tests
        working-directory: frontend
        run: npx playwright test e2e/public-smoke.spec.mjs --reporter=line
      - name: Collect browser server logs
        if: always()
        run: |
          mkdir -p frontend/test-results
          cp /tmp/acadlyx-api-browser-smoke.log frontend/test-results/ 2>/dev/null || true
          cp /tmp/acadlyx-web-browser-smoke.log frontend/test-results/ 2>/dev/null || true
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-login-browser-evidence
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 30

  production-smoke:
    name: Production deployment smoke checks
    needs:
      - backend
      - frontend
      - prisma-migrations
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production-upgrade-2026-09-20'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify live deployments
        env:
          ACADLYX_API_URL: https://acadlyx-api.onrender.com
          ACADLYX_WEB_URL: https://acadlyx-orcin.vercel.app
        run: node scripts/production-smoke.mjs
